distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
# services.gradle.org 在部分网络环境下不可达：实测 TLS 握手会被直接中断
# （javax.net.ssl.SSLHandshakeException: Remote host terminated the handshake），
# 而且配置代理也无效——该域名本身被阻断。因此换用腾讯云镜像。
# 若你的网络能直连官方源，可改回：
#   https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
distributionUrl=https\://mirrors.cloud.tencent.com/gradle/gradle-9.3.1-all.zip
