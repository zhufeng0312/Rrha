name: rrha
description: "Rrha —— 多平台内容聚合与播放器（B 站 / 微博，直连官方接口）"
publish_to: "none"
version: 0.3.0+5

# 说明：本工程由 AI 在**无网络环境**下编写，以下版本约束是保守下界，
# 未经过 pub.dev 实际解析验证。`flutter pub get` 时若提示某包不存在或
# 需要更高版本，按提示放宽即可。详见 README「已知风险」。
environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- 网络 ----
  dio: ^5.4.3

  # ---- XML / HTML ----
  # 刻意不使用 dart_rss / webfeed：RSSHub 输出大量扩展命名空间
  # （media: / dc: / weibo:）与非标准 CDATA，直接遍历 XML 树更可控。
  # 理由见 README「与原计划的偏离」。
  xml: ^6.5.0

  # ---- 摘要（Bilibili WBI 签名）----
  crypto: ^3.0.3

  # ---- 弹幕 deflate 解压 ----
  archive: ^3.4.10

  # ---- 状态管理 ----
  flutter_riverpod: ^2.5.1

  # ---- 播放器：通道 A（MP4 单流）----
  video_player: ^2.8.6

  # ---- 播放器：通道 B（DASH 音视频分离流）----
  media_kit: ^1.1.10
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # ---- 存储 ----
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  flutter_secure_storage: ^9.2.2

  # ---- 工具 ----
  intl: ^0.19.0
  qr_flutter: ^4.1.0
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
