include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    todo: ignore

    # 重要：本工程是在**没有 Flutter SDK 的机器上**编写的，第一次
    # `flutter analyze` 的输出就是最重要的诊断信号。风格类 lint 会产生
    # 几百条 info，把真正的编译错误淹没，因此这里全部静音。
    # 等你确认零 error 之后，可以逐条打开它们做代码风格收敛。
    prefer_const_constructors: ignore
    prefer_const_declarations: ignore
    prefer_single_quotes: ignore
    use_build_context_synchronously: ignore
    unawaited_futures: ignore
    library_private_types_in_public_api: ignore
    sort_child_properties_last: ignore
  exclude:
    - build/**
    - android/**

linter:
  rules:
    # 唯一额外保留的规则：避免误用 print（日志统一走 core/utils/logger.dart）。
    avoid_print: true
